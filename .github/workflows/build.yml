name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- Quality gate: the trust-model test suite ----------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/core
      - name: Core tests (unit + e2e over real iroh transport)
        run: cargo test -p social67-core

  # ---------- Desktop: Linux ----------
  linux:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: System dependencies (WebKitGTK — the Linux WebView)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Build desktop app (.deb + AppImage) and node binaries
        working-directory: app
        run: |
          pnpm install
          pnpm tauri build --bundles deb appimage
          cd ..
          cargo build --release -p social67-node -p social67-admin
      - uses: actions/upload-artifact@v4
        with:
          name: linux-desktop
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: linux-node-binaries
          path: |
            target/release/social67-node
            target/release/social67-admin

  # ---------- Desktop: Windows ----------
  windows:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Build desktop app (.msi + NSIS .exe) and node binaries
        working-directory: app
        run: |
          pnpm install
          pnpm tauri build --bundles msi nsis
          cd ..
          cargo build --release -p social67-node -p social67-admin
      - uses: actions/upload-artifact@v4
        with:
          name: windows-desktop
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-node-binaries
          path: |
            target/release/social67-node.exe
            target/release/social67-admin.exe

  # ---------- Desktop: macOS ----------
  macos:
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Build desktop app (.dmg) and node binaries (unsigned)
        working-directory: app
        run: |
          pnpm install
          pnpm tauri build --bundles dmg
          cd ..
          cargo build --release -p social67-node -p social67-admin
      - uses: actions/upload-artifact@v4
        with:
          name: macos-desktop
          path: target/release/bundle/dmg/*.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos-node-binaries
          path: |
            target/release/social67-node
            target/release/social67-admin

  # ---------- Mobile: Android ----------
  # Debug-signed APKs (installable for testing). Release builds to Play
  # Store need a keystore stored as a repo secret — see README.
  android:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Rust + Android targets
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi \
            x86_64-linux-android i686-linux-android
      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - name: Android SDK — licenses + NDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null
          yes | "$SDKM" "ndk;27.0.12077973" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Build Android APKs (all ABIs, debug-signed)
        working-directory: app
        run: |
          pnpm install
          pnpm tauri android init
          pnpm tauri android build --apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: app/src-tauri/gen/android/app/build/outputs/apk/**/*.apk

