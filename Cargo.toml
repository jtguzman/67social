[workspace]
resolver = "2"
members = ["crates/core", "crates/node", "crates/admin", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Jose Tomas Guzman"]

[workspace.dependencies]
social67-core = { path = "crates/core" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["alloc"] }
ed25519-dalek = { version = "2", features = ["serde"] }
x25519-dalek = { version = "2", features = ["static_secrets", "getrandom"] }
chacha20poly1305 = "0.10"
blake3 = "1"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.9"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
data-encoding = "2"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
n0-future = "0.3"

iroh = "1.3"
iroh-blobs = { version = "0.103.1", features = ["fs-store"] }
iroh-gossip = "0.101"

[profile.release]
lto = true
strip = true